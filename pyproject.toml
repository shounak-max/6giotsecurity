[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-ids"
version = "0.1.0"
description = "Federated Intrusion Detection for 6G Edge: Privacy, Poisoning Robustness, Non-IID, and Minority-Attack Recall"
authors = [{ name = "FL-IDS Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
